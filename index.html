<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nikud · Hebrew vocalizer</title>
<style>
  :root { font: 16px system-ui, sans-serif; color: #23302b; background: #f3f3e9; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1000px; padding: 56px 24px; margin: auto; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
  h1 { margin: 0; font: 700 56px Georgia, serif; color: #174936; }
  h1 small { display: block; font: 500 16px system-ui, sans-serif; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { background: #fffdf6; border: 1px solid #d2d9ca; border-radius: 16px; padding: 20px; min-width: 0; }
  h2, label { font-size: 15px; font-weight: 650; margin: 0; }
  textarea, #result { color: inherit; font: 25px/1.65 Arial, sans-serif; min-height: 175px; padding: 12px; width: 100%; margin: 12px 0; border: 1px solid #d2d9ca; border-radius: 8px; background: #fffefb; }
  textarea { resize: vertical; }
  #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  button { font: inherit; cursor: pointer; color: #174936; background: #e9eee3; border: 1px solid #cbd6c7; padding: 8px 13px; border-radius: 7px; }
  button.primary { color: white; background: #174936; border-color: #174936; }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 3px solid #497a9b; outline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ambiguous { font: inherit; color: #174936; padding: 0 2px; border: 0; border-bottom: 2px solid #699078; background: #e5eee4; }
  .unresolved { background: #fff0bb; border-color: #ad7a27; }
  #review { margin-top: 14px; }
  #options { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; }
  #options button[aria-pressed="true"] { background: #174936; color: white; }
  #status { min-height: 1.5em; margin-top: 14px; }
  @media (max-width: 680px) {
    main { padding: 24px 14px; }
    header { align-items: flex-start; flex-direction: column; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
<main>
  <header>
    <h1><span lang="he" dir="rtl">נִקּוּד</span><small>Hebrew vocalizer</small></h1>
  </header>
  <div class="grid">
    <section class="panel">
      <label for="source">Hebrew text</label>
      <textarea id="source" lang="he" dir="rtl" placeholder="הקלידו מילה או משפט" maxlength="1500"></textarea>
      <div class="actions">
        <button id="run" class="primary" title="Ctrl or ⌘ + Enter">Add or remove nikud</button>
        <button id="paste">Paste</button>
      </div>
    </section>
    <section class="panel">
      <h2>Result</h2>
      <div id="result" lang="he" dir="rtl" aria-label="Processed Hebrew text"></div>
      <textarea id="manual" lang="he" dir="rtl" aria-label="Edit the suggested nikud" hidden></textarea>
      <button id="copy" disabled>Copy result</button>
      <button id="edit" disabled>Edit nikud…</button>
    </section>
  </div>
  <section id="review" class="panel" hidden>
    <h2 id="review-title" tabindex="-1"></h2>
    <div id="options" lang="he" dir="rtl"></div>
  </section>
  <p id="status" role="status"></p>
  <nav class="actions" aria-label="Feedback">
    <a href="https://github.com/dviradar5/Nikud/issues/new?template=bug.yml" target="_blank" rel="noopener noreferrer">Report a bug</a>
    <a href="https://github.com/dviradar5/Nikud/issues/new?template=word.yml" target="_blank" rel="noopener noreferrer">Report a word mistake</a>
  </nav>
</main>
<script>
  const byId = id => document.getElementById(id);
  const source = byId('source');
  const run = byId('run');
  const result = byId('result');
  const status = byId('status');
  const review = byId('review');
  const copy = byId('copy');
  const edit = byId('edit');
  const manual = byId('manual');
  const stripNikud = text => text.normalize('NFD').replace(/[\u05b0-\u05bd\u05bf\u05c1\u05c2\u05c7]/g, '').normalize();
  let words = [];
  let snapshot = '';
  let active = -1;

  function compoundStart(index) {
    if (words[index]?.compound) return index;
    return words[index - 1]?.compound ? index - 1 : -1;
  }

  function needsReading(word, index) {
    const start = compoundStart(index);
    return word.selected < 0 && word.choices.length > 1 &&
      (start < 0 || words[start].useCompound === false);
  }

  function render() {
    manual.hidden = true;
    result.hidden = false;
    edit.textContent = 'Edit nikud…';
    edit.disabled = !words.length;
    result.replaceChildren();
    let end = 0;
    for (let i = 0; i < words.length; i++) {
      const word = words[i];
      result.append(snapshot.slice(end, word.start));
      const useCompound = word.compound && word.useCompound !== false;
      const next = useCompound && words[i + 1];
      const text = useCompound
        ? word.compound.parts.join(snapshot.slice(word.start + word.original.length, next.start))
        : word.choices[word.selected]?.text ?? word.original;
      if (word.compound || word.choices.length > 1) {
        const button = document.createElement('button');
        button.className = needsReading(word, i) ? 'ambiguous unresolved' : 'ambiguous';
        button.textContent = text;
        button.title = 'Choose a reading';
        button.onclick = () => showChoices(i, true);
        result.append(button);
      } else {
        result.append(text);
      }
      end = next ? next.start + next.original.length : word.start + word.original.length;
      if (next) i++;
    }
    result.append(snapshot.slice(end));
    const pending = words.filter(needsReading).length;
    const skipped = words.filter(word => !word.choices.length).length;
    copy.disabled = !words.length || pending > 0;
    const notice = [];
    if (pending) notice.push(`Choose a reading for ${pending} highlighted ${pending === 1 ? 'word' : 'words'}.`);
    else if (words.some(word => word.compound || word.choices.length > 1)) notice.push('Select highlighted text to review its readings.');
    if (skipped) notice.push(`${skipped} ${skipped === 1 ? 'word was' : 'words were'} left as typed because the suggested spelling differed.`);
    status.textContent = notice.join(' ');
  }

  function showChoices(index, focus = false) {
    active = index;
    review.hidden = index < 0;
    if (index < 0) return;
    const word = words[index];
    const title = byId('review-title');
    const label = document.createElement('bdi');
    label.textContent = word.original;
    label.lang = 'he';
    title.replaceChildren('Choose a reading for ', label);
    const options = byId('options');
    options.replaceChildren();
    const start = compoundStart(index);
    if (start >= 0) {
      const phrase = words[start];
      const useCompound = phrase.useCompound !== false;
      const grouped = document.createElement('button');
      grouped.textContent = `${phrase.compound.parts.join(' ')} — ${phrase.compound.meaning}`;
      grouped.setAttribute('aria-pressed', useCompound);
      grouped.onclick = () => {
        phrase.useCompound = true;
        render();
        showChoices(start, true);
      };
      const separate = document.createElement('button');
      separate.textContent = 'בחירת ניקוד לכל מילה בנפרד';
      separate.setAttribute('aria-pressed', !useCompound);
      separate.onclick = () => {
        phrase.useCompound = false;
        render();
        showChoices(start, true);
      };
      options.append(grouped, separate);
      if (useCompound) {
        label.textContent = phrase.original + ' ' + words[start + 1].original;
        if (focus) title.focus();
        return;
      }
    }
    for (const [choiceIndex, choice] of word.choices.entries()) {
      const button = document.createElement('button');
      button.textContent = choice.meaning ? `${choice.text} — ${choice.meaning}` : choice.text;
      button.setAttribute('aria-pressed', choiceIndex === word.selected);
      button.onclick = () => {
        word.selected = choiceIndex;
        render();
        const next = unresolvedIndex();
        showChoices(next < 0 ? active : next, true);
      };
      options.append(button);
    }
    if (focus) title.focus();
  }

  function unresolvedIndex() {
    return words.findIndex(needsReading);
  }

  source.addEventListener('input', () => {
    if (run.disabled) return;
    words = [];
    snapshot = '';
    showChoices(-1);
    render();
  });

  run.onclick = async () => {
    if (!source.value.trim()) {
      status.textContent = 'Enter a Hebrew word or sentence.';
      source.focus();
      return;
    }
    const submitted = source.value;
    run.disabled = true;
    source.readOnly = true;
    byId('paste').disabled = true;
    words = [];
    snapshot = '';
    showChoices(-1);
    render();
    status.textContent = 'Processing text…';
    try {
      const response = await fetch('/api/nikud', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Nikud-Session': '__SESSION_TOKEN__' },
        body: JSON.stringify({ text: submitted }),
      });
      const reply = await response.json();
      if (!response.ok) throw new Error(reply.error || 'The request failed.');
      words = reply.words;
      snapshot = submitted;
      render();
      showChoices(unresolvedIndex(), true);
      if (!status.textContent) status.textContent = 'Nikud updated.';
    } catch (error) {
      status.textContent = error.message;
    } finally {
      run.disabled = false;
      source.readOnly = false;
      byId('paste').disabled = false;
    }
  };

  byId('paste').onclick = async () => {
    try {
      const clipboard = await navigator.clipboard.readText();
      if (source.readOnly) return;
      source.value = clipboard.slice(0, source.maxLength);
      source.dispatchEvent(new Event('input'));
      if (clipboard.length > source.maxLength) status.textContent = 'Pasted the first 1,500 characters.';
      source.focus();
    } catch {
      source.focus();
      status.textContent = 'Use Ctrl+V or ⌘+V to paste into the text box.';
    }
  };
  function validateManual() {
    copy.disabled = stripNikud(manual.value) !== stripNikud(snapshot);
    status.textContent = copy.disabled ? 'Keep the original letters, spacing, and punctuation.' : 'Review your edits, then copy the result.';
  }
  manual.addEventListener('input', validateManual);
  edit.onclick = () => {
    if (!manual.hidden) {
      render();
      showChoices(unresolvedIndex(), true);
      return;
    }
    manual.value = result.textContent;
    result.hidden = true;
    manual.hidden = false;
    edit.textContent = 'Use suggestions';
    showChoices(-1);
    validateManual();
    manual.focus();
  };
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(manual.hidden ? result.textContent : manual.value);
      status.textContent = 'Copied.';
    } catch {
      if (!manual.hidden) {
        manual.focus();
        manual.select();
        status.textContent = 'Use Ctrl+C or ⌘+C to copy the selected result.';
        return;
      }
      const range = document.createRange();
      range.selectNodeContents(result);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      status.textContent = 'Use Ctrl+C or ⌘+C to copy the selected result.';
    }
  };
  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
      event.preventDefault();
      run.click();
    }
  });
</script>
</html>
