name: Report a bug
description: Report a problem with launch, the shortcut, or another app feature.
title: "[Bug] "
assignees:
  - dviradar5
body:
  - type: markdown
    attributes:
      value: This report will be public. Use sample text and remove personal details.
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nikud version
      placeholder: "For example, 0.2.1"
  - type: input
    id: app
    attributes:
      label: Affected app
      placeholder: Microsoft Word, Chrome, or Nikud Settings
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
